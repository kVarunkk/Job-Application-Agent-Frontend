steps:
  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker buildx build \
          --secret id=NEXT_PUBLIC_SUPABASE_URL,env=NEXT_PUBLIC_SUPABASE_URL \
          --secret id=NEXT_PUBLIC_SUPABASE_ANON_KEY,env=NEXT_PUBLIC_SUPABASE_ANON_KEY \
          --secret id=SERVICE_ROLE_KEY,env=SERVICE_ROLE_KEY \
          -t gcr.io/$PROJECT_ID/nextjs-app:$COMMIT_SHA .
    secretEnv:
      - "NEXT_PUBLIC_SUPABASE_URL"
      - "NEXT_PUBLIC_SUPABASE_ANON_KEY"
      - "SERVICE_ROLE_KEY"

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/nextjs-app:$COMMIT_SHA"]

  - name: "gcr.io/://google.com"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "nextjs-app"
      - "--image=gcr.io/$PROJECT_ID/nextjs-app:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8080"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_URL/versions/latest
      env: "NEXT_PUBLIC_SUPABASE_URL"
    - versionName: projects/$PROJECT_ID/secrets/NEXT_PUBLIC_SUPABASE_ANON_KEY/versions/latest
      env: "NEXT_PUBLIC_SUPABASE_ANON_KEY"
    - versionName: projects/$PROJECT_ID/secrets/SERVICE_ROLE_KEY/versions/latest
      env: "SERVICE_ROLE_KEY"
